# Local overrides for the Amazing theme.
# Hexo loads this file in addition to themes/amazing/_config.yml.

# To enable comments later, replace the theme's sample Gitalk values with
# credentials from your own GitHub OAuth application.

# Override the theme's built-in branding (the theme ships the original
# author's logo/favicon/Open Graph values pointing at removeif's CDN).
logo:
    text: '-[CH2-CH2]-n'

head:
    favicon: source/img/avatar.png
    open_graph:
        title:
        type: blog
        url:
        image:
        site_name:
        author:
        description:
        twitter_card:
        twitter_id:
        twitter_site:

# Keep the navigation limited to pages that exist in this blog by default.
navbar:
  menu:
    Home: /
    Archives: /archives
    Categories: /categories
    Tags: /tags


widgets:
    # Table of contents widget configurations
    -
        # Where should the widget be placed, left sidebar or right sidebar
        position: left
        type: toc
        # Select show index
        index: false
    # Profile widget configurations
    -
        # Where should the widget be placed, left sidebar or right sidebar
        position: left
        type: profile
        # Author name
        author: -[CH2-CH2]-n
        # Author title
        author_title: 。。。
        # Author's current location
        location: China
        # URL or path to the avatar image
        avatar: /img/avatar.png
        # Whether show the rounded avatar image
        avatar_rounded: true
        # Email address for the Gravatar
        gravatar: 
        # URL or path for the follow button
        follow_link: 'https://github.com/Godknow3'
        # Links to be shown on the bottom of the profile widget
        social_links:
            Github:
                icon: fab fa-github
                url: 'https://github.com/Godknow3'
            RSS:
                icon: fas fa-rss
                url: /atom.xml
        has_hitokoto: true
